<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake | Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=14">
  <style>
    .snake-page {
      width: min(1040px, calc(100% - 2.5rem));
      padding-top: clamp(2rem, 5vw, 4.5rem);
    }

    .snake-layout {
      display: grid;
      gap: clamp(1.5rem, 4vw, 3rem);
    }

    .snake-topbar {
      display: grid;
      gap: 1rem;
    }

    .snake-metrics,
    .snake-pickers {
      display: grid;
      gap: 0.65rem;
    }

    .chip {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      border-top: 1px solid var(--line);
      padding: 0.7rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .chip strong {
      color: var(--text);
      font-size: 1rem;
    }

    .snake-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }

    .snake-page button {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .snake-page button:hover {
      background: #27272a;
      border-color: #3f3f46;
    }

    .snake-game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 280px);
      gap: clamp(1rem, 3vw, 2rem);
      align-items: start;
    }

    .snake-side {
      display: grid;
      gap: 1.25rem;
      align-content: start;
      border-top: 1px solid var(--line);
      padding-top: 1.25rem;
    }

    .snake-side h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .color-box {
      display: grid;
      gap: 0.65rem;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 10px;
      padding: 0.65rem;
      transition: border-color 150ms ease;
    }

    .color-box:hover {
      border-color: #3f3f46;
    }

    .color-box span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .color-choice {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .color-swatch {
      width: 1.45rem;
      height: 1.45rem;
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.18);
    }

    .color-picker {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.28rem 0.65rem;
      min-width: 78px;
      background: var(--bg);
      color: #ffffff;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .color-picker option {
      color: #09090b;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.4rem;
    }

    .palette-swatch {
      width: 100%;
      aspect-ratio: 1;
      min-height: 0;
      padding: 0;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
    }

    .palette-swatch.active {
      border-color: #e4e4e7;
      box-shadow: 0 0 0 2px #09090b, 0 0 0 4px #e4e4e7;
    }

    .palette-swatch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }


.snake-board-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      padding: clamp(0.5rem, 1.5vw, 0.9rem);
      display: grid;
      place-items: center;
    }

    #snake-board {
      display: block;
      width: min(100%, 560px);
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #050507;
      image-rendering: pixelated;
    }

    .snake-help {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      justify-content: center;
      gap: 0.42rem;
      margin-top: 0;
    }

    .touch-controls button {
      border-radius: 10px;
      padding: 0.6rem 0;
    }

    .touch-controls .empty {
      visibility: hidden;
    }

    @media (max-width: 820px) {
      .snake-page {
        width: min(100% - 1.25rem, 1040px);
        padding-top: 1.5rem;
      }

      .snake-game {
        grid-template-columns: 1fr;
      }

      .snake-side {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="/">Scout</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/">Home</a>
        <a class="active" href="/snake.html">Snake</a>
        <a href="/crime.html">Crime</a>
        <a href="/running.html">Running</a>
      </nav>
    </div>
  </header>

  <main class="page snake-page">
    <article class="snake-layout">
      <section class="snake-game" aria-label="Snake game">
        <div class="snake-board-wrap">
          <canvas id="snake-board" width="480" height="480" aria-label="Snake game board"></canvas>
        </div>

        <aside class="snake-side" aria-label="Game settings">
          <div class="snake-topbar">
            <div class="snake-actions">
              <button id="start-btn" type="button">Start</button>
              <button id="restart-btn" type="button">Restart</button>
            </div>
            <div class="snake-metrics">
              <span class="chip">Score <strong id="score">0</strong></span>
              <span class="chip">Best <strong id="best">0</strong></span>
              <span class="chip">State <strong id="state">Ready</strong></span>
            </div>
          </div>

          <div class="snake-pickers" aria-label="Color pickers">
            <h2>Colors</h2>
            <label class="color-box" for="snake-color">
              <span>Snake</span>
              <span class="color-choice">
                <span class="color-swatch" data-swatch-for="snake-color" aria-hidden="true"></span>
                <select id="snake-color" class="color-picker" title="Snake color" aria-label="Snake color">
                  <option value="#7cf7d2" style="background:#7cf7d2;">Mint</option>
                  <option value="#56d4ff" style="background:#56d4ff;">Sky</option>
                  <option value="#22c55e" style="background:#22c55e;">Green</option>
                  <option value="#84cc16" style="background:#84cc16;">Lime</option>
                  <option value="#facc15" style="background:#facc15;">Yellow</option>
                  <option value="#f97316" style="background:#f97316;">Orange</option>
                  <option value="#fb923c" style="background:#fb923c;">Peach</option>
                  <option value="#f43f5e" style="background:#f43f5e;">Rose</option>
                  <option value="#ef4444" style="background:#ef4444;">Red</option>
                  <option value="#a855f7" style="background:#a855f7;">Purple</option>
                  <option value="#6366f1" style="background:#6366f1;">Indigo</option>
                  <option value="#e4e4e7" style="background:#e4e4e7;">White</option>
                </select>
              </span>
            </label>
            <label class="color-box" for="food-color">
              <span>Food</span>
              <span class="color-choice">
                <span class="color-swatch" data-swatch-for="food-color" aria-hidden="true"></span>
                <select id="food-color" class="color-picker" title="Food color" aria-label="Food color">
                  <option value="#7cf7d2" style="background:#7cf7d2;">Mint</option>
                  <option value="#56d4ff" style="background:#56d4ff;">Sky</option>
                  <option value="#22c55e" style="background:#22c55e;">Green</option>
                  <option value="#84cc16" style="background:#84cc16;">Lime</option>
                  <option value="#facc15" style="background:#facc15;">Yellow</option>
                  <option value="#f97316" style="background:#f97316;">Orange</option>
                  <option value="#fb923c" style="background:#fb923c;">Peach</option>
                  <option value="#f43f5e" style="background:#f43f5e;" selected>Rose</option>
                  <option value="#ef4444" style="background:#ef4444;">Red</option>
                  <option value="#a855f7" style="background:#a855f7;">Purple</option>
                  <option value="#6366f1" style="background:#6366f1;">Indigo</option>
                  <option value="#e4e4e7" style="background:#e4e4e7;">White</option>
                </select>
              </span>
            </label>
          </div>

          <p class="snake-help">Controls: Arrow keys / WASD. On mobile, use the directional buttons below.</p>

          <div class="touch-controls" aria-label="Touch controls">
            <span class="empty"></span>
            <button data-dir="up" type="button">Up</button>
            <span class="empty"></span>
            <button data-dir="left" type="button">Left</button>
            <button data-dir="down" type="button">Down</button>
            <button data-dir="right" type="button">Right</button>
          </div>
        </aside>
      </section>
    </article>
  </main>

  <script>
    (function () {
      const board = document.getElementById("snake-board");
      const ctx = board.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const stateEl = document.getElementById("state");
      const startBtn = document.getElementById("start-btn");
      const restartBtn = document.getElementById("restart-btn");
      const snakeColorSelect = document.getElementById("snake-color");
      const foodColorSelect = document.getElementById("food-color");

      const tileSize = 24;
      const tiles = board.width / tileSize;
      const speed = 120;
      const dangerSpeed = 180;
      const bestKey = "scout_og_snake_best";

      let snake;
      let dir;
      let nextDir;
      let food;
      let score;
      let loopId;
      let running = false;
      let gameOver = false;

      let snakeColor = snakeColorSelect.value;
      let foodColor = foodColorSelect.value;

      function randomCell() {
        return {
          x: Math.floor(Math.random() * tiles),
          y: Math.floor(Math.random() * tiles)
        };
      }

      function placeFood() {
        let candidate = randomCell();
        while (snake.some((part) => part.x === candidate.x && part.y === candidate.y)) {
          candidate = randomCell();
        }
        food = candidate;
      }

      function setState(label) {
        stateEl.textContent = label;
      }

      function loadBest() {
        const value = Number(localStorage.getItem(bestKey) || "0");
        bestEl.textContent = String(value);
      }

      function saveBest(value) {
        const best = Number(localStorage.getItem(bestKey) || "0");
        if (value > best) {
          localStorage.setItem(bestKey, String(value));
          bestEl.textContent = String(value);
        }
      }

      function clamp(value) {
        return Math.max(0, Math.min(255, value));
      }

      function shade(hex, amount) {
        const raw = hex.replace("#", "");
        const r = clamp(parseInt(raw.slice(0, 2), 16) + amount);
        const g = clamp(parseInt(raw.slice(2, 4), 16) + amount);
        const b = clamp(parseInt(raw.slice(4, 6), 16) + amount);
        return "#" + [r, g, b].map((n) => n.toString(16).padStart(2, "0")).join("");
      }

      function applyPickerVisual(selectEl) {
        const hex = selectEl.value;
        const raw = hex.replace("#", "");
        const r = parseInt(raw.slice(0, 2), 16);
        const g = parseInt(raw.slice(2, 4), 16);
        const b = parseInt(raw.slice(4, 6), 16);
        const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
        selectEl.style.background = "#09090b";
        selectEl.style.color = "#ffffff";
        selectEl.style.borderColor = luminance > 0.55 ? "#3f3f46" : "#52525b";
        const swatch = document.querySelector('[data-swatch-for="' + selectEl.id + '"]');
        if (swatch) {
          swatch.style.background = hex;
          swatch.style.boxShadow = "0 0 22px " + hex + "55, 0 0 0 3px rgba(0, 0, 0, 0.18)";
        }
        document.querySelectorAll('[data-color-target="' + selectEl.id + '"]').forEach(function (button) {
          const active = button.getAttribute("data-color-value") === hex;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        const wrapper = selectEl.closest(".color-box");
        if (wrapper) {
          wrapper.style.borderColor = luminance > 0.55 ? "#3f3f46" : "#52525b";
          wrapper.style.background = shade(hex, -140);
        }
      }

      function buildPalette(selectEl) {
        const wrapper = selectEl.closest(".color-box");
        if (!wrapper || wrapper.querySelector(".palette-grid")) {
          return;
        }

        const palette = document.createElement("div");
        palette.className = "palette-grid";
        palette.setAttribute("aria-label", selectEl.getAttribute("aria-label") + " choices");

        Array.from(selectEl.options).forEach(function (option) {
          const button = document.createElement("button");
          button.className = "palette-swatch";
          button.type = "button";
          button.title = option.textContent;
          button.setAttribute("aria-label", option.textContent);
          button.setAttribute("aria-pressed", "false");
          button.setAttribute("data-color-target", selectEl.id);
          button.setAttribute("data-color-value", option.value);
          button.style.background = option.value;
          button.addEventListener("click", function () {
            selectEl.value = option.value;
            selectEl.dispatchEvent(new Event("change", { bubbles: true }));
          });
          palette.appendChild(button);
        });

        wrapper.appendChild(palette);
      }

      function resetGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        running = false;
        gameOver = false;
        scoreEl.textContent = "0";
        placeFood();
        setState("Ready");
        draw();
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * tileSize + 1, y * tileSize + 1, tileSize - 2, tileSize - 2);
      }

      function drawGrid() {
        ctx.fillStyle = "#050507";
        ctx.fillRect(0, 0, board.width, board.height);

        ctx.strokeStyle = "#1a1a1d";
        ctx.lineWidth = 1;
        for (let i = 0; i <= tiles; i += 1) {
          const pos = i * tileSize;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, board.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(board.width, pos);
          ctx.stroke();
        }
      }

      function draw() {
        drawGrid();
        drawCell(food.x, food.y, foodColor);
        const bodyColor = shade(snakeColor, -55);
        snake.forEach((part, idx) => {
          drawCell(part.x, part.y, idx === 0 ? snakeColor : bodyColor);
        });
      }

      function collide(point) {
        if (point.x < 0 || point.x >= tiles || point.y < 0 || point.y >= tiles) {
          return true;
        }
        return snake.some((part) => part.x === point.x && part.y === point.y);
      }

      function nextMoveWouldCollide() {
        const head = snake[0];
        return collide({ x: head.x + nextDir.x, y: head.y + nextDir.y });
      }

      function scheduleTick() {
        clearTimeout(loopId);
        loopId = setTimeout(tick, nextMoveWouldCollide() ? dangerSpeed : speed);
      }

      function tick() {
        dir = nextDir;
        const head = snake[0];
        const nextHead = { x: head.x + dir.x, y: head.y + dir.y };

        if (collide(nextHead)) {
          running = false;
          gameOver = true;
          clearTimeout(loopId);
          setState("Game Over");
          saveBest(score);
          return;
        }

        snake.unshift(nextHead);

        if (nextHead.x === food.x && nextHead.y === food.y) {
          score += 1;
          scoreEl.textContent = String(score);
          placeFood();
        } else {
          snake.pop();
        }

        draw();
        if (running) {
          scheduleTick();
        }
      }

      function setDirection(dx, dy) {
        if (dx === -dir.x && dy === -dir.y) {
          return;
        }
        nextDir = { x: dx, y: dy };
      }

      function startGame() {
        if (running) {
          return;
        }

        if (gameOver) {
          resetGame();
        }

        running = true;
        setState("Running");
        scheduleTick();
      }

      function restartGame() {
        clearTimeout(loopId);
        resetGame();
      }

      function directionFromKey(key) {
        if (key === "arrowup" || key === "w") return { x: 0, y: -1 };
        if (key === "arrowdown" || key === "s") return { x: 0, y: 1 };
        if (key === "arrowleft" || key === "a") return { x: -1, y: 0 };
        if (key === "arrowright" || key === "d") return { x: 1, y: 0 };
        return null;
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        const mapped = directionFromKey(key);

        if (mapped) {
          event.preventDefault();
          if (!running) {
            startGame();
          }
          setDirection(mapped.x, mapped.y);
          return;
        }

        if (!running && key === " ") {
          startGame();
        }
      });

      document.querySelectorAll("[data-dir]").forEach((button) => {
        button.addEventListener("click", () => {
          const dirName = button.getAttribute("data-dir");
          const map = {
            up: { x: 0, y: -1 },
            down: { x: 0, y: 1 },
            left: { x: -1, y: 0 },
            right: { x: 1, y: 0 }
          };
          const mapped = map[dirName];
          if (!mapped) {
            return;
          }
          if (!running) {
            startGame();
          }
          setDirection(mapped.x, mapped.y);
        });
      });

      snakeColorSelect.addEventListener("change", function () {
        snakeColor = snakeColorSelect.value;
        applyPickerVisual(snakeColorSelect);
        draw();
      });

      foodColorSelect.addEventListener("change", function () {
        foodColor = foodColorSelect.value;
        applyPickerVisual(foodColorSelect);
        draw();
      });

      startBtn.addEventListener("click", startGame);
      restartBtn.addEventListener("click", restartGame);

      loadBest();
      buildPalette(snakeColorSelect);
      buildPalette(foodColorSelect);
      applyPickerVisual(snakeColorSelect);
      applyPickerVisual(foodColorSelect);
      resetGame();
    })();
  </script>
</body>
</html>
